# 开发用覆盖：源码挂载 + 热重载
#   docker compose -f compose.yml -f compose.dev.yml up
services:
  api:
    build:
      target: test
    volumes:
      - ./backend:/srv
    command: >
      sh -c "alembic upgrade head &&
             uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload"

  worker:
    build:
      target: test
    volumes:
      - ./backend:/srv

  feishu:
    build:
      target: test
    volumes:
      - ./backend:/srv

  web:
    depends_on:
      api:
        condition: service_healthy
    build: !reset null
    image: node:22-alpine
    working_dir: /app
    environment:
      VITE_API_TARGET: http://api:8000
    volumes:
      - ./frontend:/app
      - web_node_modules:/app/node_modules
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0"
    ports: !override
      - "${BIND_ADDR:-127.0.0.1}:${WEB_PORT:-5173}:5173"

volumes:
  web_node_modules:
