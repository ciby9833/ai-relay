<!doctype html>
<html lang="zh-CN">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Relay · 对话工作台交互原型</title><style>/*CSS*/</style></head>
<body>
<div class="prototype-bar"><div><b>RELAY</b><span class="bar-separator">/</span>对话工作台 <span class="demo-badge">交互原型 · 示例数据</span></div><div class="prototype-tools"><button id="device" aria-pressed="false">手机预览</button><select id="scenario" aria-label="演示场景"><option value="normal">日常工作</option><option value="urgent">即时提醒</option><option value="loading">加载中</option><option value="empty">暂无事项</option><option value="error">同步失败</option><option value="after">会后行动</option></select><button id="help">体验指引</button><a href="handoff.html" target="_blank" rel="noopener">研发说明 ↗</a><button id="reset">重置</button></div></div>
<div id="stage"><div id="app" class="relay-app">
<aside class="sidebar" aria-label="全局导航"><a class="brand" href="#" aria-label="Relay 首页"><span class="brand-star">✦</span>Relay</a><button class="new-chat" data-action="new-chat"><span data-icon="plus"></span>新对话<span class="keyhint">⌘ N</span></button><button class="nav-today selected" data-action="today"><span data-icon="sun"></span>今天</button><div class="sidebar-caption">最近对话</div><button class="history-item" data-action="history" data-id="m1">雅加达质量改进会</button><button class="history-item" data-action="history" data-id="t3">加班车辆分析 Agent</button><button class="history-item" data-action="history" data-id="t4">吉利项目进展</button><div class="sidebar-bottom"><button data-action="settings"><span data-icon="sliders"></span>提醒偏好</button><div class="profile"><span class="avatar">X</span><div>Xavier 吴川<small>J&T Cargo Indonesia</small></div></div></div></aside>
<div class="workspace"><main id="main" class="chat-main"><header class="chat-header"><div class="page-heading"><span class="mobile-brand">✦</span><div><strong>今天</strong><span>10 月 29 日 · 周四</span></div></div><button class="icon-button" id="focus-toggle" aria-label="收起工作侧栏" title="收起工作侧栏"><span data-icon="panel"></span></button></header>
<div class="dock-area"><div id="work-dock" class="work-dock" aria-label="对话中的工作入口"></div><div class="dock-caption"><span class="sync-dot"></span><span id="sync-text">已同步 · 10:10</span><span>只在需要你时提醒</span></div></div>
<div id="chat-scroll" class="chat-scroll"><div id="messages" class="messages"></div></div>
<div class="composer-area"><div id="suggestions" class="suggestions"><button data-action="suggest" data-text="我上午需要先处理什么？">我先处理什么？</button><button data-action="suggest" data-text="帮我准备 10:30 的质量改进会">准备下一场会议</button></div><div class="composer"><div id="context-chip" class="context-chip" hidden></div><textarea id="message-input" rows="2" placeholder="问 Relay，或交给它一件事…" aria-label="发送给 Relay 的消息"></textarea><div class="composer-footer"><span>背景已整理，随时接着问</span><button id="send" class="send-button" aria-label="发送消息"><span data-icon="arrow-up"></span></button></div></div><p class="composer-note">对外发送与审批，都会先让你确认。</p></div></main>
<aside id="inspector" class="inspector" aria-label="工作详情"><div id="panel-head" class="panel-head"></div><div id="panel-body" class="panel-body"></div><div id="panel-footer" class="panel-footer"></div></aside></div>
<div id="peek" class="peek" role="tooltip" hidden></div><div id="toast" class="toast" role="status" aria-live="polite" hidden></div>
<div id="modal-layer" class="modal-layer" hidden><section id="modal" class="modal" role="dialog" aria-modal="true" aria-labelledby="modal-title" tabindex="-1"></section></div>
</div></div><script>/*JS*/</script></body></html>
