function mainIntro(){if(view.scenario==='urgent')return `<div class="day-divider">今天 · 10:20</div><div class="assistant-head"><span class="spark">✦</span>Relay ${badge('现在需要确认','amber')}<time>刚刚</time></div><h1 class="greeting">会议快开始了，参会方式还没确认。</h1><p class="assistant-copy">10:30 的质量改进会将在 <strong>10 分钟后</strong>开始。邀请中没有会议链接，我已经整理好背景，可以先替你起草给 Jose 的确认消息。</p><button class="inline-object" data-action="open" data-kind="meetings" data-id="m1"><span class="object-symbol">${icon('calendar')}</span><span class="object-title">雅加达质量改进会<small>需要你确认参会方式 · 10:30 开始</small></span>${icon('chevron')}</button><button class="secondary" style="margin-top:15px" data-action="join" data-id="m1">起草确认消息</button><div class="quiet-summary">现在提醒你，因为等待到简报可能错过会议。${badge('示例场景')}</div>`;return `<div class="day-divider">今天 · 10:10</div><div class="assistant-head"><span class="spark">✦</span>Relay <time>为你整理</time></div><h1 class="greeting">早上好，Xavier。</h1><p class="assistant-copy">上午有两场会议<strong>时间重叠</strong>。质量改进会的背景已经整理好，你可以先看重点，再决定如何安排参会。</p><button class="inline-object" data-action="open" data-kind="meetings" data-id="m1"><span class="object-symbol">${icon('calendar')}</span><span class="object-title">10:30 · 雅加达质量改进会<small>会前简报已就绪 · 3 份相关材料</small></span>${icon('chevron')}</button><div class="source-foot"><span></span>已关联上次纪要、会议议程和 Jose 的会前说明</div><div class="quiet-summary">其他事项已经放在上方。<button data-action="category" data-category="tasks">查看待处理 ${icon('chevron')}</button></div>`;}
function renderMessages(){let intro=view.scenario==='empty'?`<div class="assistant-head"><span class="spark">✦</span>Relay</div><h1 class="greeting">现在没有需要你介入的事。</h1><p class="assistant-copy">有新的重要变化时，我会告诉你。你也可以直接交给我一件事。</p>`:mainIntro();$('#messages').innerHTML=intro+messages.map(m=>m.role==='user'?`<div class="user-message">${esc(m.text)}</div>`:`<article class="assistant-reply"><div class="assistant-head"><span class="spark">✦</span>Relay</div>${m.html}</article>`).join('');}
function renderContext(){const el=$('#context-chip');el.hidden=!view.context;if(view.context)el.innerHTML=`${icon(view.context.kind==='meetings'?'calendar':'file')}<span>正在讨论 · ${esc(view.context.title)}</span><button data-action="clear-context" aria-label="移除讨论上下文">${icon('close')}</button>`;}
function rsvp(m){return state.rsvp[m.id]||m.rsvp;}
function prep(m){return state.prep[m.id]||m.prep;}
function meetingList(){return `<p class="panel-description">所有会议集中在这里。打开一场，查看背景、资料与需要你做的准备。</p><div class="conflict-note">${icon('alert')}<span>10:30 有两场会议重叠，请确认参会安排。</span></div>${['今天','明天'].map(day=>`<div class="section-label"><strong>${day}</strong><span>${meetings.filter(m=>m.date===day).length} 场</span></div>${meetings.filter(m=>m.date===day).map(m=>`<button class="meeting-row" data-action="open" data-kind="meetings" data-id="${m.id}"><span class="time-column">${m.time}<small>${m.end}</small></span><span class="row-main"><span class="row-title">${m.title}</span><span class="row-meta">${m.organizer}</span><span class="row-trailing">${badge(rsvp(m)==='pending'?'待回复邀请':rsvp(m)==='declined'?'已拒绝':rsvp(m)==='tentative'?'暂定':'已接受',rsvp(m)==='pending'?'amber':'')}${prep(m)==='ready'?badge('简报已就绪','green'):''}</span></span>${icon('chevron')}</button>`).join('')}`).join('')}<p class="list-note">${icon('shield')}仅使用与你及本次会议相关的可访问材料</p>`;}
function taskList(){let list=activeTasks();const extra=state.afterAdded&&state.tasks.t5==='open';return `<p class="panel-description">明确需要推进的事。私聊中的闲聊和背景信息，不会自动变成待办。</p>${['mine','waiting'].map(group=>{const arr=list.filter(t=>(t.type==='waiting')===(group==='waiting'));return `<div class="section-label"><strong>${group==='mine'?'需要你':'在等对方'}</strong><span>${arr.length+(group==='mine'&&extra?1:0)}</span></div>${arr.map(t=>`<button class="task-row" data-action="open" data-kind="tasks" data-id="${t.id}"><span class="task-marker ${group==='waiting'?'wait':''}"></span><span class="row-main"><span class="row-title">${t.type==='approval-group'?`${4-state.approved.length} 张新功能需求申请待审批`:t.title}</span><span class="row-meta">${t.person} · ${t.when}</span>${t.type==='approval-group'?badge(`${4-state.approved.length} 张仍待审批`):''}${t.type==='promise'?badge('你的承诺','green'):''}</span>${icon('chevron')}</button>`).join('')}${group==='mine'&&extra?`<button class="task-row" data-action="open" data-kind="tasks" data-id="t5"><span class="task-marker"></span><span class="row-main"><span class="row-title">整理本周质量指标口径</span><span class="row-meta">Jose · 下次同步前</span>${badge('来自会议纪要','green')}</span>${icon('chevron')}</button>`:''}${!arr.length&&!(group==='mine'&&extra)?'<p class="panel-description">这一组暂时没有需要跟进的事。</p>':''}`}).join('')}`;}
function getTask(id){return tasks.find(t=>t.id===id)||(id==='t5'?{id:'t5',title:'整理本周质量指标口径',person:'Jose',type:'promise',when:'下次同步前',summary:'整理本周质量指标口径，发给 Jose 确认。',reason:'本次会议纪要明确将该行动项分配给你。',sources:['s8']}:null);}
function materials(ids){return ids.map(id=>{const s=sources[id];return `<button class="material-row" data-action="source" data-id="${id}">${icon(s.type.includes('聊')?'chat':'file')}<span>${s.title}<small>${s.type} · ${s.when}<br>${s.relation}</small></span><span class="arrow">›</span></button>`}).join('');}
function meetingDetail(m){const ended=view.scenario==='after'&&m.id==='m1';return `<div class="detail-eyebrow">${badge(ended?'会议已结束':`${m.date} ${m.time}`)}${badge(rsvp(m)==='pending'?'待回复邀请':rsvp(m)==='declined'?'已拒绝':rsvp(m)==='tentative'?'暂定':'已接受',rsvp(m)==='pending'?'amber':'green')}</div><h3 class="detail-title">${m.title}</h3><div class="detail-meta"><div>${icon('clock')}${m.date} ${m.time}–${m.end} · 雅加达时间</div><div>${icon('people')}组织者 ${m.organizer}</div></div>${m.conflict&&!ended?`<div class="conflict-note">${icon('alert')}<span>与另一场 10:30 会议重叠。<button data-action="open" data-kind="meetings" data-id="${m.id==='m1'?'m2':'m1'}" style="text-decoration:underline;padding:0">查看另一场</button></span></div>`:''}<div class="detail-tabs" role="tablist" aria-label="会议详情"><button role="tab" id="tab-brief" aria-controls="meeting-tab-panel" tabindex="${view.tab==='brief'?0:-1}" data-action="detail-tab" data-tab="brief" aria-selected="${view.tab==='brief'}">会前简报</button><button role="tab" id="tab-materials" aria-controls="meeting-tab-panel" tabindex="${view.tab==='materials'?0:-1}" data-action="detail-tab" data-tab="materials" aria-selected="${view.tab==='materials'}">相关材料 <span>${m.sources.length+(ended?1:0)}</span></button><button role="tab" id="tab-actions" aria-controls="meeting-tab-panel" tabindex="${view.tab==='actions'?0:-1}" data-action="detail-tab" data-tab="actions" aria-selected="${view.tab==='actions'}">会后行动</button></div><div role="tabpanel" id="meeting-tab-panel" aria-labelledby="tab-${view.tab}">${view.tab==='materials'?`<p class="panel-description">每份材料都保留关联依据。私聊只用于理解这场会议。</p>${materials(ended?[...m.sources,'s8']:m.sources)}${!m.sources.length?'<div class="missing-note">尚未找到与这场会议直接相关的材料。</div>':''}`:view.tab==='actions'?(ended?`<div class="detail-section"><h3>纪要中的你的行动项</h3><p>整理本周质量指标口径，在下次同步前发给 Jose 确认。</p></div>${materials(['s8'])}<button class="secondary" style="width:100%;margin-top:18px" data-action="add-action" ${state.afterAdded?'disabled':''}>${state.afterAdded?'已加入待处理':'加入待处理'}</button><p class="small-note">仅跟踪分配给你的行动项。</p>`:`<div class="empty-state"><div class="empty-icon">${icon('file')}</div><h3>会议结束后，继续跟进行动</h3><p>找到本次纪要后，会展示明确分配给你的事项。当前不会猜测会议结论。</p></div>`):prep(m)==='loading'?`<p class="panel-description" role="status">正在检查本次邀请、历史纪要和关联消息…</p><div class="skeleton"></div><div class="skeleton"></div>`:prep(m)==='ready'?`<div class="fact-box"><h3>这次会议要推进什么</h3><p>${m.summary}</p></div><div class="detail-section"><h3>你需要关注</h3><ul>${m.id==='m1'?'<li>责任人和改善时间是否已经明确。</li><li>本周质量指标采用什么口径。</li><li>哪些异常仍然受阻，需要你协调。</li>':'<li>调研结论是否已经对齐。</li><li>需求整理的责任分工是否明确。</li>'}</ul></div><div class="detail-section"><h3>从上次会议延续</h3><p>${m.id==='m1'?'上次已要求建立异常订单责任人清单；本次重点确认改善进展。':'本次需要确认上次会议留下的需求整理工作。'}</p></div><div class="missing-note">${m.id==='m1'?'邀请中没有会议链接，参会方式仍需确认。尚无依据表明需要你当场审批。':'未找到需要你当场审批的明确要求。'}</div><div class="section-label"><strong>依据</strong><span>${m.sources.length} 份</span></div>${materials(m.sources.slice(0,2))}${m.sources.length>2?'<button class="text-action" data-action="detail-tab" data-tab="materials" style="padding-left:0">查看全部相关材料 →</button>':''}`:`<div class="empty-state"><div class="empty-icon">${icon('file')}</div><h3>背景材料还不完整</h3><p>已确认会议时间和组织者。尚未找到直接关联的议程或纪要，不生成推测性简报。</p><button class="secondary" data-action="prepare" data-id="${m.id}" style="width:100%">${icon('refresh')}重新查找相关材料</button></div>`}</div>`;}
function meetingFooter(m){return `<div class="action-stack"><button class="primary" data-action="ask" data-kind="meetings" data-id="${m.id}">${icon('chat')}带着这场会议问 Relay</button>${rsvp(m)==='pending'?`<button class="secondary" data-action="rsvp" data-id="${m.id}">回复会议邀请</button>`:`<button class="text-action" data-action="join" data-id="${m.id}">${icon('video')}${m.id==='m1'?'确认参会方式':'加入会议'}</button>`}</div>`;}
function taskDetail(t){const status=state.tasks[t.id];return `<div class="detail-eyebrow">${badge(status==='open'?(t.type==='waiting'?'在等对方':'需要你'):status==='done'?'已处理':'已停止跟踪',status==='open'?'amber':'green')}</div><h3 class="detail-title">${t.type==='approval-group'?`${4-state.approved.length} 张新功能需求申请待审批`:t.title}</h3><div class="detail-meta"><div>${icon('people')}${t.person}</div><div>${icon('clock')}${t.when}</div></div><div class="fact-box"><h3>下一步</h3><p>${t.summary}</p></div><div class="detail-section"><h3>为什么出现在这里</h3><p>${t.reason}</p></div>${t.type==='approval-group'?`<div class="section-label"><strong>独立申请</strong><span>${state.approved.length}/4 已审批</span></div>${approvals.map(a=>`<div class="approval-row"><span>${a.title}<small>申请人 ${a.name}</small></span>${state.approved.includes(a.id)?badge('已同意','green'):`<button data-action="approval" data-id="${a.id}">查看</button>`}</div>`).join('')}<p class="small-note">合并展示，逐张确认；操作不会影响其他申请。</p>`:`<div class="section-label"><strong>相关信息</strong><span>${t.sources.length} 份</span></div>${materials(t.sources)}`}${t.id==='t5'?'<button class="related-item" data-action="open" data-kind="meetings" data-id="m1">雅加达质量改进会<small>返回来源会议 →</small></button>':''}`;}
function taskFooter(t){return `<div class="action-stack"><button class="primary" data-action="ask" data-kind="tasks" data-id="${t.id}">${icon('chat')}围绕这件事问 Relay</button>${state.tasks[t.id]==='open'?`<div class="action-row">${t.type!=='approval-group'?`<button class="secondary" data-action="done" data-id="${t.id}">已处理</button>`:''}<button class="text-action" data-action="dismiss" data-id="${t.id}">不用跟了</button></div>`:''}</div>`;}
function progressList(){const rows=state.progress.filter(p=>view.filter==='all'||p.kind===view.filter);return `<p class="panel-description">结果和状态变化集中在这里。普通完成消息不再占据对话。</p><div class="filter-row" aria-label="进展筛选">${[['all','全部'],['done','已完成'],['stopped','不再跟进']].map(([k,n])=>`<button data-action="filter" data-filter="${k}" aria-pressed="${view.filter===k}">${n}</button>`).join('')}</div><div class="section-label"><strong>今天</strong><span>${rows.length} 条变化</span></div>${rows.map(p=>`<button class="progress-row" data-action="open" data-kind="progress" data-id="${p.id}"><span class="progress-icon ${p.kind==='stopped'?'stopped':''}">${p.kind==='stopped'?'−':'✓'}</span><span><span class="progress-title">${p.title}</span><small>${p.time} · ${p.kind==='stopped'?'停止跟踪':'已完成'}</small></span></button>`).join('')}${!rows.length?'<p class="panel-description">当前筛选下没有进展。</p>':''}`;}
function renderPanel(){const el=$('#inspector');el.classList.toggle('closed',!view.open);$('#main').inert=view.open&&isCompact();if(!view.open)return;el.setAttribute('role',isCompact()?'dialog':'complementary');if(isCompact())el.setAttribute('aria-modal','true');else el.removeAttribute('aria-modal');let back=view.selected||view.source;$('#panel-head').innerHTML=`${back?`<button class="icon-button" data-action="back" aria-label="${view.source?'返回详情':'返回列表'}">${icon('back')}</button>`:''}<h2 id="panel-title" tabindex="-1">${view.source?'资料原文':titles[view.category]}${!view.selected?`<span class="counter">${counts()[view.category]}</span>`:''}</h2><button class="icon-button" data-action="close-panel" aria-label="回到对话">${icon('close')}</button>`;let body='',footer='';if(view.scenario==='loading'){body='<p class="panel-description" role="status">正在同步你的工作信息…</p>'+('<div class="skeleton"></div>'.repeat(4));footer='<button class="secondary" data-action="load-ready" style="width:100%">完成加载（演示）</button>';}else if(view.scenario==='error'){body=`<div class="empty-state"><div class="empty-icon">${icon('alert')}</div><h3>暂时无法同步</h3><p>上次记录仍然保留。暂不根据过时信息发出新提醒。</p><button class="secondary" data-action="retry" style="width:100%">重新同步</button></div>`;}else if(view.scenario==='empty'){body=`<div class="empty-state"><div class="empty-icon">${icon(view.category==='meetings'?'calendar':'check')}</div><h3>${view.category==='meetings'?'近期没有会议':view.category==='tasks'?'没有需要你处理的事':'暂时没有新的进展'}</h3><p>你可以继续对话。有需要关注的变化时，Relay 会在这里更新。</p></div>`;}else if(view.source){const s=sources[view.source];body=`<div class="detail-eyebrow">${badge(s.type)}${badge('示例材料','accent')}</div><h3 class="detail-title">${s.title}</h3><p class="panel-description">${s.when}<br>关联依据：${s.relation}</p><div class="source-document"><div class="demo-alert">用于演示资料展开与上下文关联，非真实邮件或私聊全文。</div><h3>内容摘录</h3><p>${esc(s.body)}</p></div>`;footer=`<button class="primary" style="width:100%" data-action="ask-source" data-id="${view.source}">${icon('chat')}就这份资料提问</button>`;}else if(view.selected){if(view.category==='meetings'){const m=meetings.find(m=>m.id===view.selected);body=meetingDetail(m);footer=meetingFooter(m);}else if(view.category==='tasks'){const t=getTask(view.selected);body=taskDetail(t);footer=taskFooter(t);}else{const p=state.progress.find(p=>p.id===view.selected);if(p){body=`<div class="detail-eyebrow">${badge(p.kind==='done'?'已完成':'停止跟踪',p.kind==='done'?'green':'')}</div><h3 class="detail-title">${p.title}</h3><div class="detail-meta">今天 ${p.time}</div><div class="detail-section"><h3>状态依据</h3><p>${p.detail}</p></div>`;if(p.taskId)footer=`<button class="secondary" style="width:100%" data-action="open" data-kind="tasks" data-id="${p.taskId}">查看原事项与相关信息</button>`;}}}else{body=view.category==='meetings'?meetingList():view.category==='tasks'?taskList():progressList();}$('#panel-body').innerHTML=body;$('#panel-footer').innerHTML=footer;}
function render(){renderDock();renderPanel();renderContext();}
function openCategory(k){lastFocus=document.activeElement;view.category=k;view.selected=null;view.source=null;view.open=true;hidePeek();render();$('#panel-body').scrollTop=0;$('#panel-title')?.focus({preventScroll:true});}
function openItem(kind,id){lastFocus=document.activeElement;view.category=kind;view.selected=id;view.source=null;view.open=true;view.tab=view.scenario==='after'&&id==='m1'?'actions':'brief';hidePeek();render();$('#panel-body').scrollTop=0;$('#panel-title')?.focus({preventScroll:true});}
function closePanel(){view.open=false;hidePeek();render();const target=lastFocus?.isConnected&&!lastFocus.closest('#inspector')?lastFocus:$(`[data-category="${view.category}"]`);target?.focus({preventScroll:true});}
function back(){if(view.source)view.source=null;else view.selected=null;render();$('#panel-body').scrollTop=0;$('#panel-title')?.focus({preventScroll:true});}
function showToast(text,undo=false){clearTimeout(toastTimer);$('#toast').hidden=false;$('#toast').innerHTML=`<span>${esc(text)}</span>${undo?'<button data-action="undo">撤销</button>':''}`;toastTimer=setTimeout(()=>$('#toast').hidden=true,undo?9000:4500);}
function snapshot(){undoState=JSON.stringify(state);}
function addProgress(title,kind,detail,taskId=null){state.progress.unshift({id:'p'+Date.now()+Math.random().toString(16).slice(2,5),title,kind,time:'10:11',detail,taskId});}
function changeTask(id,status,reason){snapshot();state.tasks[id]=status;const t=getTask(id);addProgress(t.title,status==='done'?'done':'stopped',reason,id);persist();render();showToast(status==='done'?'已处理，记录已移入进展':'已停止跟踪此事项',true);}
function openModal(title,content,footer=''){modalFocus=document.activeElement;$('#modal').innerHTML=`<div class="modal-header"><h2 id="modal-title">${title}</h2><button class="icon-button" data-action="close-modal" aria-label="关闭对话框">${icon('close')}</button></div>${content}${footer}`;$('#modal-layer').hidden=false;$('.workspace').inert=true;$('.sidebar').inert=true;hidePeek();$('#modal').focus();}
function closeModal(){ $('#modal-layer').hidden=true;$('.workspace').inert=false;$('.sidebar').inert=false;$('#main').inert=view.open&&isCompact();if(modalFocus?.isConnected)modalFocus.focus({preventScroll:true});}
function chooseModal(title,desc,options,onChoose){openModal(title,`<p>${desc}</p><div class="options">${options.map((s,i)=>`<button class="option-button" data-choice="${i}">${s}</button>`).join('')}</div><p class="small-note">只改变当前事项，可撤销。</p>`);$$('[data-choice]').forEach(b=>b.onclick=()=>{closeModal();onChoose(Number(b.dataset.choice));});}
function attachContext(kind,id,title){view.context={kind,id,title};if(isCompact())view.open=false;render();$('#message-input').focus();showToast('已带上相关背景，直接接着问');}
function sendMessage(text){text=(text??$('#message-input').value).trim();if(!text)return;const context=view.context,recipient=context?.kind==='meetings'?meetings.find(m=>m.id===context.id)?.organizer:context?.kind==='tasks'?getTask(context.id)?.person:'待确认';messages.push({role:'user',text});$('#message-input').value='';let html='';if((context?.kind==='meetings'||/会议|上午/.test(text))&&!(/草稿|起草|回复|催/.test(text)&&context)){const m=meetings.find(m=>m.id===context?.id)||meetings[0];html=`<p>关于<strong>${esc(m.title)}</strong>，${m.summary}</p>${m.id==='m1'?'<p>根据上次纪要和 Jose 的补充说明，你可以先确认责任人与改善时间，再对齐质量指标口径。参会方式还没有确认。</p>':'<p>目前只使用已找到的直接关联材料；没有资料支持的内容会保持待确认。</p>'}<button class="evidence-link" data-action="open" data-kind="meetings" data-id="${m.id}">查看会议与依据 →</button>`;}else if(/草稿|起草|回复|催/.test(text)&&context){html=`<p>先准备一版供你确认：</p><div class="draft-box">${context.kind==='meetings'?`${esc(recipient)}，你好。想确认一下「${esc(context.title)}」的参会方式，方便发一下会议链接或地点吗？谢谢。`:`你好，想同步一下「${esc(context.title)}」的最新进展。目前还有哪些信息需要我补充？方便时请回复，谢谢。`}</div><button class="secondary" data-action="send-draft" data-recipient="${esc(recipient)}">检查并确认发送</button>`;}else if(context?.kind==='source'){const s=sources[context.id];html=`<p>这份资料与当前事项的关联是：${s.relation}。可见内容是：</p><div class="evidence-quote">${esc(s.body.split('\n')[0])}</div><p>这段私聊或文档作为背景使用，不会仅因被引用而生成新待办。</p>`;}else if(context?.kind==='tasks'){const t=getTask(context.id);html=`<p>这件事目前的下一步是：${t.summary}</p><p>${t.reason}</p><button class="evidence-link" data-action="open" data-kind="tasks" data-id="${t.id}">查看事项与依据 →</button>`;}else if(/先处理/.test(text)){html='<p>建议先确认两场 10:30 会议的参会安排。其余待处理事项中，版本验收的截止时间是明天 18:00，目前不需要立即打断你的安排。</p><button class="evidence-link" data-action="category" data-category="tasks">打开待处理 →</button>';}else{html='<p>这是一条原型演示回复。你可以打开上方的待处理或会议，选择“问 Relay”，体验携带背景继续对话。正式产品将在这里接入实际模型与工具。</p>';}messages.push({role:'assistant',html});renderMessages();requestAnimationFrame(()=>$('#chat-scroll').scrollTop=$('#chat-scroll').scrollHeight);}
function hidePeek(){clearTimeout(peekTimer);$('#peek').hidden=true;}
function showPeek(el){if(isCompact()||view.open&&view.category===el.dataset.category)return;clearTimeout(peekTimer);peekTimer=setTimeout(()=>{const k=el.dataset.category;let rows=k==='meetings'?meetings.slice(0,3).map(m=>`${m.time} · ${m.title}`):k==='tasks'?activeTasks().slice(0,3).map(t=>t.title):state.progress.slice(0,3).map(p=>p.title);if(view.scenario==='empty')rows=['暂无内容'];$('#peek').innerHTML=`<b>${titles[k]} · ${counts()[k]}</b>${rows.map(t=>`<p>${esc(t)}</p>`).join('')}<small>点击入口展开；每个事项保留独立状态。</small>`;const a=$('#app').getBoundingClientRect(),r=el.getBoundingClientRect();$('#peek').style.left=Math.min(Math.max(r.left-a.left,10),a.width-310)+'px';$('#peek').style.top=r.bottom-a.top+9+'px';$('#peek').hidden=false;},320);}
$('#work-dock').addEventListener('pointerover',e=>{const el=e.target.closest('[data-category]');if(el&&e.pointerType!=='touch')showPeek(el);});$('#work-dock').addEventListener('pointerout',hidePeek);$('#work-dock').addEventListener('focusin',e=>{const el=e.target.closest('[data-category]');if(el)showPeek(el);});$('#work-dock').addEventListener('focusout',hidePeek);
document.addEventListener('click',e=>{const b=e.target.closest('[data-action]');if(!b)return;const {action:a,id,kind,category}=b.dataset;switch(a){
case'category':openCategory(category);break;case'open':openItem(kind,id);break;case'back':back();break;case'close-panel':closePanel();break;case'detail-tab':view.tab=b.dataset.tab;renderPanel();$('#tab-'+view.tab)?.focus({preventScroll:true});break;
case'source':view.source=id;renderPanel();$('#panel-body').scrollTop=0;$('#panel-title').focus({preventScroll:true});break;
case'ask':{const o=kind==='meetings'?meetings.find(m=>m.id===id):getTask(id);attachContext(kind,id,o.title);break;}
case'ask-source':attachContext('source',id,sources[id].title);break;case'clear-context':view.context=null;renderContext();$('#message-input').focus();break;
case'suggest':sendMessage(b.dataset.text);break;case'done':chooseModal('这件事是什么时候处理的？','这能帮助 Relay 分清有效提醒和过时提醒。',['收到提醒后处理完成','收到提醒前就已处理'],i=>changeTask(id,'done',i===0?'你确认：收到提醒后处理完成。':'你反馈：收到提醒前就已处理，属于过时提醒。'));break;
case'dismiss':chooseModal('为什么不用跟了？','不会影响其他事项，也不会自动修改你的长期偏好。',['不归我处理','不值得持续提醒','与已有事项重复','暂时不跟进'],i=>changeTask(id,'stopped','你选择停止跟踪，原因：'+['不归我处理','不值得持续提醒','与已有事项重复','暂时不跟进'][i]+'。'));break;
case'undo':if(undoState){state=JSON.parse(undoState);undoState=null;persist();if(view.category==='progress'&&view.selected&&!state.progress.some(p=>p.id===view.selected))view.selected=null;render();showToast('已撤销，状态已恢复');}break;
case'filter':view.filter=b.dataset.filter;renderPanel();break;
case'rsvp':{const m=meetings.find(m=>m.id===id);openModal('回复会议邀请',`<p><strong>${m.title}</strong><br>${m.date} ${m.time}–${m.end}</p><div class="options">${[['accepted','接受邀请'],['tentative','暂定'],['declined','拒绝邀请']].map(([v,t])=>`<button class="option-button" data-rsvp="${v}" aria-pressed="false">${t}</button>`).join('')}</div><div class="demo-alert">演示操作，不会向组织者发送回复。</div>`,`<div class="action-row"><button class="secondary" data-action="close-modal">取消</button><button class="primary" id="confirm-rsvp" disabled>确认回复</button></div>`);let selected;$$('[data-rsvp]').forEach(el=>el.onclick=()=>{selected=el.dataset.rsvp;$$('[data-rsvp]').forEach(x=>x.setAttribute('aria-pressed',String(x===el)));$('#confirm-rsvp').disabled=false;});$('#confirm-rsvp').onclick=()=>{snapshot();state.rsvp[id]=selected;addProgress('已回复：'+m.title,'done','你确认了会议邀请回复；参会安排仍保留在会议列表。');persist();closeModal();render();showToast('邀请状态已更新（演示）',true);};break;}
case'approval':{const item=approvals.find(x=>x.id===id);openModal('查看并确认这一张申请',`<p><strong>${item.title}</strong><br>申请人：${item.name}</p><div class="fact-box"><h3>申请内容 · 示例</h3><p>为业务人员增加对应查询或导出能力。审批仅作用于当前申请。</p></div><div class="demo-alert">原型演示，不会调用真实审批接口。</div>`,`<div class="action-row"><button class="secondary" data-action="close-modal">返回</button><button class="primary" id="confirm-approval">确认同意此申请</button></div>`);$('#confirm-approval').onclick=()=>{snapshot();if(!state.approved.includes(id))state.approved.push(id);addProgress(item.title+'已同意','done','你确认同意了 '+item.name+' 的这一张申请，其他申请不受影响。','t2');if(state.approved.length===4)state.tasks.t2='done';persist();closeModal();render();showToast(`这一张已审批，还有 ${4-state.approved.length} 张待处理`,true);};break;}
case'join':{const m=meetings.find(m=>m.id===id);if(m.id==='m1'){attachContext('meetings',id,m.title);$('#message-input').value='请帮我起草一条向 Jose 确认参会方式的消息';}else{openModal('加入会议',`<p>${m.title}<br>${m.date} ${m.time}–${m.end}</p><div class="demo-alert">这是会议跳转交互演示，没有连接真实飞书会议。</div>`,`<div class="action-row"><button class="secondary" data-action="close-modal">取消</button><button class="primary" id="join-confirm">确认加入（演示）</button></div>`);$('#join-confirm').onclick=()=>{closeModal();showToast('正式产品会打开该场会议的原始链接');};}break;}
case'prepare':{state.prep[id]='loading';renderPanel();clearTimeout(prepTimers[id]);prepTimers[id]=setTimeout(()=>{state.prep[id]='missing';persist();if(view.selected===id)renderPanel();showToast('仍未找到直接相关材料，已保留待确认状态');},1300);break;}
case'add-action':snapshot();state.afterAdded=true;state.tasks.t5='open';persist();render();showToast('已加入待处理，来源纪要已关联',true);break;
case'close-modal':closeModal();break;
case'send-draft':{const draft=b.parentElement.querySelector('.draft-box')?.textContent||'';openModal('确认发送草稿',`<p><strong>发送对象：</strong>${esc(b.dataset.recipient||'待确认')}<br><strong>渠道：</strong>飞书私聊 · 演示</p><div class="draft-box">${esc(draft)}</div><div class="demo-alert">原型没有连接消息服务，不会发送任何消息。</div>`,`<div class="action-row"><button class="secondary" data-action="close-modal">返回修改</button><button class="primary" id="confirm-demo-send">确认发送（演示）</button></div>`);$('#confirm-demo-send').onclick=()=>{closeModal();showToast('已演示确认流程，未实际发送');};break;}
case'new-chat':messages=[];view.context=null;renderMessages();renderContext();$('#message-input').value='';$('#message-input').focus();showToast('新对话已准备好，工作事项仍然保留');break;
case'today':messages=[];renderMessages();$('#chat-scroll').scrollTop=0;break;
case'history':{const k=id.startsWith('m')?'meetings':'tasks',o=k==='meetings'?meetings.find(m=>m.id===id):getTask(id);attachContext(k,id,o.title);sendMessage('接着聊聊这件事的最新情况');break;}
case'settings':openModal('提醒偏好',`<p>让提醒跟上你的工作节奏。</p><label class="setting-row">需要我立即行动时提醒<input type="checkbox" checked></label><label class="setting-row">普通完成结果只进入进展<input type="checkbox" checked></label><label class="setting-row">会前提供相关资料<input type="checkbox" checked></label><p class="small-note">此处演示偏好入口，不保存到真实账号。</p>`,`<button class="primary" data-action="save-settings" style="width:100%;margin-top:20px">完成</button>`);break;case'save-settings':closeModal();showToast('已完成偏好交互演示');break;
case'retry':view.scenario='loading';$('#scenario').value='loading';render();setTimeout(()=>{view.scenario='normal';$('#scenario').value='normal';render();showToast('同步恢复（演示）');},1000);break;
case'load-ready':view.scenario='normal';$('#scenario').value='normal';render();break;
}});
$('#send').onclick=()=>sendMessage();$('#message-input').addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey&&!e.isComposing){e.preventDefault();sendMessage();}});$('#focus-toggle').onclick=()=>view.open?closePanel():openCategory(view.category);
$('#device').onclick=()=>{view.phone=!view.phone;$('#app').classList.toggle('phone',view.phone);$('#device').setAttribute('aria-pressed',String(view.phone));$('#device').textContent=view.phone?'桌面预览':'手机预览';view.open=!view.phone;render();};
$('#scenario').onchange=e=>{view.scenario=e.target.value;view.selected=null;view.source=null;view.open=true;if(view.scenario==='after'){view.category='meetings';view.selected='m1';view.tab='actions';}render();renderMessages();};
$('#reset').onclick=()=>{Object.values(prepTimers).forEach(clearTimeout);state=defaultState();messages=[];undoState=null;view={...view,category:'meetings',selected:null,source:null,context:null,scenario:'normal',filter:'all',tab:'brief',open:!isCompact()};$('#scenario').value='normal';$('#message-input').value='';persist();closeModal();render();renderMessages();showToast('演示数据已重置');};
$('#help').onclick=()=>openModal('从这里开始体验',`<p>对话保持在主区域，工作信息按需展开。所有内容为示例，操作不会影响真实业务。</p><ol><li>悬停上方入口可快速预览；点击进入列表。</li><li>打开 10:30 会议，查看简报与相关私聊。</li><li>点击“带着这场会议问 Relay”，继续提问。</li><li>处理一个待办，查看数量和进展同步变化。</li><li>切到手机预览，体验全屏详情及返回。</li></ol><p>快捷键：Enter 发送，Shift + Enter 换行，Esc 逐层返回。顶部可切换加载、空状态、同步失败和会后场景。</p>`,`<button class="primary" data-action="close-modal" style="width:100%">开始体验</button>`);
$('.brand').onclick=e=>{e.preventDefault();messages=[];renderMessages();openCategory('meetings');};
$('#modal-layer').addEventListener('click',e=>{if(e.target===$('#modal-layer'))closeModal();});
document.addEventListener('keydown',e=>{if(e.target.matches('[role=tab]')&&['ArrowLeft','ArrowRight','Home','End'].includes(e.key)){e.preventDefault();const ts=['brief','materials','actions'];view.tab=e.key==='Home'?'brief':e.key==='End'?'actions':ts[(ts.indexOf(view.tab)+(e.key==='ArrowRight'?1:2))%3];renderPanel();$('#tab-'+view.tab).focus({preventScroll:true});return;}if(e.key==='Escape'){e.preventDefault();hidePeek();if(!$('#modal-layer').hidden)closeModal();else if(view.source||view.selected)back();else if(view.open)closePanel();}if((e.metaKey||e.ctrlKey)&&e.key.toLowerCase()==='n'){e.preventDefault();$('[data-action="new-chat"]').click();}if(e.key==='Tab'){const box=!$('#modal-layer').hidden?$('#modal'):isCompact()&&view.open?$('#inspector'):null;if(box){const controls=[...box.querySelectorAll('button:not(:disabled),a,textarea,input,select')].filter(x=>x.getClientRects().length);if(!controls.length)return;const first=controls[0],last=controls.at(-1);if(e.shiftKey&&(document.activeElement===first||!box.contains(document.activeElement))){e.preventDefault();last.focus();}else if(!e.shiftKey&&(document.activeElement===last||document.activeElement===box)){e.preventDefault();first.focus();}}}});
window.addEventListener('resize',()=>{hidePeek();renderPanel();});
render();renderMessages();
window.relayPrototype={getState:()=>JSON.parse(JSON.stringify({state,view})),reset:()=>$('#reset').click()};
})();
</script></body></html>
