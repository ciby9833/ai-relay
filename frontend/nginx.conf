server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;
    # API containers may get a new IP when optional monitoring is enabled/disabled.
    # Resolve through Docker DNS instead of pinning the address at Nginx startup.
    resolver 127.0.0.11 valid=5s ipv6=off;
    set $relay_api http://api:8000;

    location /api/ {
        proxy_pass $relay_api;  # 无 URI 后缀：保留请求路径和查询参数
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # 流式回答：不缓冲，长超时
        proxy_buffering off;
        # 飞书登录跳转的 Location 带着应用开通的全部权限，会超过默认 4KB 的响应头缓冲
        proxy_buffer_size 64k;
        proxy_buffers 8 64k;
        proxy_busy_buffers_size 128k;
        proxy_read_timeout 600s;
        client_max_body_size 2m;
    }

    location = /blog {
        absolute_redirect off;
        return 301 /blog/$is_args$args;
    }

    location = /blog/ {
        try_files /index.html =404;
    }

    # Standalone HTML and all media are served from PostgreSQL by the API.
    location /blog/ {
        proxy_pass $relay_api;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Shared blog navigation and table of contents: revalidate on every visit so updates show up at once.
    location = /blog-navigation.js {
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }

    location / {
        try_files $uri /index.html;
    }
}
